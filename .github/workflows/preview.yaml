name: Preview Checks

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black==24.10.0 flake8 pytest
          pip install "dbt-snowflake==1.8.*" "sqlfluff==3.4.2"

      - name: Black format check
        run: black --check ai Airflow/Dags

      - name: Flake8 lint
        run: flake8 --max-line-length=88 ai Airflow/Dags

      - name: Python compile check
        run: python -m compileall -q ai Airflow/Dags

      - name: Run tests if present
        run: |
          if [ -d tests ] || compgen -G "test*.py" > /dev/null; then
            pytest -q
          else
            echo "No Python tests found; skipping pytest."
          fi

      - name: Parse dbt project
        working-directory: zomato_project
        env:
          SNOWFLAKE_ACCOUNT: ci-placeholder
          SNOWFLAKE_USER: ci-placeholder
          SNOWFLAKE_PASSWORD: ci-placeholder
        run: dbt parse --no-partial-parse --profiles-dir .

      - name: Check dbt Snowflake SQL syntax
        run: sqlfluff parse --dialect snowflake --templater jinja --ignore templating zomato_project/models

      - name: Check Airflow Snowflake SQL syntax
        run: sqlfluff parse --dialect snowflake --templater raw Airflow/Dags/queries/reload_raw.sql
